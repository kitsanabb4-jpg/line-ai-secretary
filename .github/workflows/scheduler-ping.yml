name: Scheduler Ping

# ยิง /api/scheduler/tick ทุก 5 นาที เพื่อให้ reminder/notification queue ทำงานอัตโนมัติ
# (Render free tier ไม่มี background job ในตัว ต้องมีตัวจุดชนวนจากภายนอกมาเรียกเป็นระยะ)
# ผลพลอยได้: การยิงเป็นระยะยังช่วยไม่ให้ Render free service หลับ (sleep) จาก inactivity ด้วย

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Debug secret length (ไม่พิมพ์ค่าจริงออกมา แค่ความยาว เพื่อเช็คว่า secret ถูกตั้งไว้จริงหรือว่าง/สั้นผิดปกติ)
        run: |
          echo "SCHEDULER_SECRET length: ${#SCHEDULER_SECRET}"
        env:
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
      - name: Call scheduler tick endpoint
        run: |
          http_code=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X GET "https://line-ai-secretary-95c3.onrender.com/api/scheduler/tick" \
            -H "x-scheduler-secret: ${{ secrets.SCHEDULER_SECRET }}")
          echo "HTTP status: $http_code"
          echo "Response body:"
          cat /tmp/response.txt
          if [ "$http_code" -ge 400 ]; then
            exit 1
          fi
